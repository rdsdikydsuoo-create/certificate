<title>تسجيل شهادة المشاركة - أكاديمية بدر البدور الدولية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#34165c,#4a2580);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#fff;width:100%;max-width:440px;border-radius:20px;padding:24px 22px;box-shadow:0 10px 40px #0005;border-top:7px solid #c49e4c;text-align:center}
img{width:140px}h1{color:#34165c;font-size:21px;margin:8px 0 4px}.ws{color:#96702c;font-weight:bold;font-size:16px;margin-bottom:14px}
.steps{display:flex;gap:8px;justify-content:center;margin-bottom:14px}.steps span{width:34px;height:6px;border-radius:3px;background:#e4dcef}.steps .on{background:#c49e4c}
p.note{color:#555;line-height:1.8;margin:6px 0 14px}
.soc{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;margin:9px 0;border-radius:11px;color:#fff;font-size:17px;font-weight:bold;text-decoration:none}
.ig{background:linear-gradient(45deg,#f9a825,#e91e63,#7b1fa2)}.fb{background:#1877f2}.soc.done::after{content:"✔"}
label{display:block;text-align:right;color:#34165c;font-weight:bold;margin:12px 0 5px}small{color:#888;font-weight:normal}
input,select{width:100%;padding:12px;border:1.5px solid #d8cfe6;border-radius:11px;font-size:16px;font-family:inherit;background:#fff}input:focus,select:focus{outline:none;border-color:#c49e4c}
button{margin-top:20px;width:100%;padding:14px;border:0;border-radius:11px;background:#34165c;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}button:disabled{opacity:.45;cursor:default}
.msg{margin-top:14px;font-size:16px;font-weight:bold}.ok{color:#1a8a3a}.bad{color:#c0392b}.hide{display:none}
</style>
